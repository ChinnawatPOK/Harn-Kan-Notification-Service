# Runs only the Notification Service. MongoDB and RabbitMQ come from ../docker-dependencies (start that first).
name: harnkan

services:
  notification-service:
    build: .
    image: harnkan/notification-service
    container_name: harnkan-notification-service
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-3002}:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      PORT: 3002
      MONGO_URI: mongodb://${NOTIFICATION_SERVICE_DB_USER}:${NOTIFICATION_SERVICE_DB_PASSWORD}@mongodb:27017/${NOTIFICATION_SERVICE_DB}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-harnkan}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-harnkan}
      JWT_SECRET: ${JWT_SECRET}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      USER_SERVICE_URL: http://user-service:3000
    networks: [harnkan-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  harnkan-net:
    external: true
